<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FitZone - Progress</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <nav class="navbar">

        <h2 class="logo">FitZone</h2>

        <ul>

            <li>
                <a href="/workout.html">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="/start-workout.html">
                    Add Workout
                </a>
            </li>

            <li>
                <a href="/history.html">
                    History
                </a>
            </li>

            <li>
                <a href="/progress.html">
                    Progress
                </a>
            </li>

        </ul>

    </nav>

</header>


<section class="dashboard">

    <h1>My Progress</h1>

    <p>
        Your workout progress
    </p>


    <div class="dashboard-cards">


        <div class="dashboard-card">

            <h2>Total Workouts</h2>

            <h1 id="totalWorkouts">
                0
            </h1>

        </div>


        <div class="dashboard-card">

            <h2>Total Duration</h2>

            <h1>

                <span id="totalDuration">
                    0
                </span>

                min

            </h1>

        </div>


        <div class="dashboard-card">

            <h2>Total Calories</h2>

            <h1 id="totalCalories">
                0
            </h1>

        </div>

    </div>


    <h2>Workout Progress</h2>


    <div id="progressWorkouts">

        <p>Loading progress...</p>

    </div>


    <br>


    <a href="/start-workout.html"
       class="btn">

        Add Workout

    </a>


    <a href="/workout.html"
       class="btn">

        Dashboard

    </a>

</section>


<script src="script.js"></script>

</body>

</html>
